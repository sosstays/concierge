<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SOS Concierge — Rathescar Grove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sos-gate" id="gate-overlay">
  <div class="sos-gate-card">
    <img class="sos-logo" alt="">
    <h1>Welcome to your stay</h1>
    <p>Tell us who's checking in so we can personalise your concierge.</p>

    <form id="gate-form" name="gate-form" method="POST" data-netlify="true" netlify-honeypot="bot-field" novalidate>
      <input type="hidden" name="form-name" value="gate-form">
      <input type="hidden" id="gate-booking" name="booking" value="">
      <p class="sos-honeypot" aria-hidden="true">
        <label>Leave this field blank: <input name="bot-field" tabindex="-1" autocomplete="off"></label>
      </p>

      <div class="sos-field">
        <label for="gate-name">Full name</label>
        <input type="text" id="gate-name" name="name" placeholder="Jane Doe" autocomplete="name">
        <span class="sos-field-error" id="gate-name-error" role="alert"></span>
      </div>

      <div class="sos-field">
        <label for="gate-email">Email address</label>
        <input type="email" id="gate-email" name="email" placeholder="jane@example.com" autocomplete="email">
        <span class="sos-field-error" id="gate-email-error" role="alert"></span>
      </div>

      <div class="sos-checkbox-field">
        <label>
          <input type="checkbox" id="gate-marketing" name="marketing">
          <span>I'd like to receive offers and marketing emails from SOS Stays. See our <a href="https://sosstays.com/privacy-policy" target="_blank" rel="noopener">Privacy Policy</a>.</span>
        </label>
      </div>

      <button type="submit" class="sos-gate-submit">Continue</button>
    </form>
  </div>
</div>

<div class="sos-page sos-hidden" id="app-root">

  <header class="sos-topbar">
    <span class="sos-topbar-spacer" aria-hidden="true"></span>
    <img class="sos-logo" alt="">
    <span class="sos-topbar-spacer" aria-hidden="true"></span>
  </header>

  <section class="sos-intro">
    <h1 id="propertyTitle">Your stay at Rathescar Grove</h1>
    <p id="propertyLocation">Managed by SOS Stays</p>
  </section>

  <section class="sos-essentials sos-checkin" id="checkin-container"></section>

  <section class="sos-essentials" id="essentials-container"></section>

  <section id="chat-container" class="sos-chat-card">
    <div class="sos-chat-head">
      <div class="sos-chat-avatar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FAFAF8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M14.5 9.5l-2 5-5 2 2-5z"></path></svg>
      </div>
      <div>
        <div class="sos-chat-title">SOS Concierge</div>
        <div class="sos-chat-subtitle">Local know-how, on tap</div>
      </div>
    </div>

    <div id="results-container" class="sos-thread" aria-live="polite"></div>

    <nav id="suggestions-container" class="sos-bar" aria-label="Suggestions"></nav>
  </section>

  <footer class="sos-managed-by">
    <p>Managed by</p>
    <img src="images/sos-stays-logo.svg" alt="SOS Stays">
  </footer>

</div>

<script src="data/locations.js"></script>
<script src="script.js"></script>
</body>
</html>
